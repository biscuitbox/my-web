<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신나는 두더지 잡기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Touch and select disable for optimal mobile gameplay */
        body {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        /* Hole 3D perspective effect */
        .mole-hole {
            position: relative;
            overflow: hidden;
            border-bottom: 8px solid #5a3d28;
            box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.6);
            background: linear-gradient(180deg, #3d2314 0%, #26140a 100%);
        }

        /* Mole sprite movement and transitions */
        .mole-character {
            position: absolute;
            width: 80%;
            height: 80%;
            left: 10%;
            bottom: -100%;
            transition: bottom 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.27);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        @media (min-width: 640px) {
            .mole-character {
                font-size: 5rem;
            }
        }

        /* Active state when popped up */
        .mole-character.up {
            bottom: 5%;
        }

        /* Active click/tap state */
        .mole-character:active {
            transform: scale(0.85);
        }

        /* Whack visual hit animation effect */
        .hit-effect {
            position: absolute;
            pointer-events: none;
            animation: pop-fade 0.4s ease-out forwards;
            font-weight: 900;
            font-size: 1.5rem;
            z-index: 20;
        }

        @keyframes pop-fade {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                transform: translate(-50%, -80%) scale(1.3);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -120%) scale(1);
            }
        }
    </style>
</head>
<body class="bg-amber-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 text-slate-800">

    <script>
        // 코드 맨 위에 지정된 GAME_ID 상수를 선언합니다.
        const GAME_ID = 'my-game';
    </script>

    <!-- Top Navigation Header & Scoreboard -->
    <header class="w-full max-w-md bg-white rounded-3xl p-4 sm:p-6 shadow-xl border-4 border-amber-800 text-center space-y-3">
        <h1 class="text-2xl sm:text-3xl font-black text-amber-900 tracking-wider">🔨 두더지 잡기!</h1>
        
        <div class="grid grid-cols-2 gap-3 bg-amber-50 p-3 rounded-2xl border-2 border-amber-200">
            <div class="flex flex-col items-center">
                <span class="text-xs sm:text-sm font-bold text-amber-700">남은 시간</span>
                <span id="time-display" class="text-3xl sm:text-4xl font-black text-red-500">30초</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-xs sm:text-sm font-bold text-amber-700">현재 점수</span>
                <span id="score-display" class="text-3xl sm:text-4xl font-black text-emerald-600">0</span>
            </div>
        </div>
    </header>

    <!-- Main Game Play Area (3x3 Grid) -->
    <main class="w-full max-w-md my-auto py-4">
        <div id="grid-container" class="grid grid-cols-3 gap-3 sm:gap-4 bg-amber-800 p-3 sm:p-4 rounded-3xl shadow-2xl border-4 border-amber-950 aspect-square">
            <!-- 3x3 holes generated dynamically via JS -->
        </div>
    </main>

    <!-- Control Buttons / Footer Area -->
    <footer class="w-full max-w-md text-center">
        <button id="start-btn" onclick="startGame()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-black text-xl sm:text-2xl py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1 transition-all">
            🎮 게임 시작하기
        </button>
    </footer>

    <!-- Game Over Modal Overlay -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-xs w-full text-center space-y-5 shadow-2xl border-4 border-amber-500 transform scale-100 transition-transform">
            <div class="text-5xl">🏆</div>
            <h2 class="text-2xl sm:text-3xl font-black text-slate-800">게임 종료!</h2>
            
            <div class="bg-amber-50 rounded-2xl p-4 border-2 border-amber-200">
                <p class="text-sm font-bold text-slate-500 mb-1">최종 점수</p>
                <p id="final-score" class="text-4xl sm:text-5xl font-black text-emerald-600">0점</p>
            </div>

            <button onclick="closeModalAndReset()" class="w-full bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-black text-lg py-3 rounded-xl shadow-md border-b-4 border-amber-700 active:border-b-0 active:translate-y-1 transition-all">
                다시 하기
            </button>
        </div>
    </div>

    <!-- JavaScript Game Logic -->
    <script>
        // 게임 상태 설정 변수
        const GAME_DURATION = 30; // 게임 시간 (30초)
        let score = 0;
        let timeLeft = GAME_DURATION;
        let gameInterval = null;
        let timerInterval = null;
        let isPlaying = false;
        let lastHoleIndex = -1;

        // DOM 요소 정의
        const scoreDisplay = document.getElementById('score-display');
        const timeDisplay = document.getElementById('time-display');
        const startBtn = document.getElementById('start-btn');
        const gridContainer = document.getElementById('grid-container');
        const gameOverModal = document.getElementById('game-over-modal');
        const finalScoreDisplay = document.getElementById('final-score');

        // 캐릭터 타입 및 설정 (+10점 두더지, -15점 폭탄, +30점 황금 두더지)
        const CHARACTERS = [
            { type: 'mole', emoji: '🐹', points: 10, weight: 65 },
            { type: 'bomb', emoji: '💣', points: -15, weight: 25 },
            { type: 'golden', emoji: '👑', points: 30, weight: 10 }
        ];

        // 3x3 격자 구멍 생성
        function createBoard() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'mole-hole rounded-2xl aspect-square flex items-center justify-center';
                hole.dataset.index = i;

                const character = document.createElement('div');
                character.className = 'mole-character';
                character.addEventListener('pointerdown', (e) => whack(e, i));

                hole.appendChild(character);
                gridContainer.appendChild(hole);
            }
        }

        // 랜덤 캐릭터 선택 (가중치 적용)
        function getRandomCharacter() {
            const totalWeight = CHARACTERS.reduce((acc, c) => acc + c.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (const char of CHARACTERS) {
                if (random < char.weight) return char;
                random -= char.weight;
            }
            return CHARACTERS[0];
        }

        // 랜덤 구멍 선택
        function getRandomHole() {
            const holes = document.querySelectorAll('.mole-hole');
            let idx = Math.floor(Math.random() * holes.length);
            while (idx === lastHoleIndex) {
                idx = Math.floor(Math.random() * holes.length);
            }
            lastHoleIndex = idx;
            return holes[idx];
        }

        // 두더지/폭탄 등장 로직
        function popUp() {
            if (!isPlaying) return;

            const hole = getRandomHole();
            const characterElem = hole.querySelector('.mole-character');
            const charData = getRandomCharacter();

            // 캐릭터 데이터 세팅
            characterElem.innerText = charData.emoji;
            characterElem.dataset.type = charData.type;
            characterElem.dataset.points = charData.points;
            characterElem.dataset.hit = 'false';

            // 두더지 올라옴
            characterElem.classList.add('up');

            // 일정 시간 후 내려감 (시간이 지날수록 조금씩 빠름)
            const speed = Math.max(500, 1000 - Math.floor((GAME_DURATION - timeLeft) * 15));
            
            setTimeout(() => {
                characterElem.classList.remove('up');
            }, speed);
        }

        // 타격(터치/클릭) 처리
        function whack(event, holeIndex) {
            if (!isPlaying) return;
            
            const characterElem = event.currentTarget;
            if (!characterElem.classList.contains('up') || characterElem.dataset.hit === 'true') return;

            // 중복 클릭 방지
            characterElem.dataset.hit = 'true';
            
            const points = parseInt(characterElem.dataset.points, 10);
            const type = characterElem.dataset.type;

            // 점수 업데이트
            score += points;
            scoreDisplay.textContent = score;

            // 텍스트 피드백 표시 (예: +10, -15)
            showHitEffect(event.clientX, event.clientY, points);

            // 타격 시 캐릭터 즉시 내려감
            characterElem.classList.remove('up');
        }

        // 타격 효과 피드백 UI
        function showHitEffect(x, y, points) {
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.style.left = `${x}px`;
            effect.style.top = `${y}px`;

            if (points > 0) {
                effect.textContent = `+${points}`;
                effect.classList.add('text-emerald-500');
            } else {
                effect.textContent = `${points}`;
                effect.classList.add('text-red-500');
            }

            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 400);
        }

        // 게임 시작
        function startGame() {
            if (isPlaying) return;

            // 초기화
            score = 0;
            timeLeft = GAME_DURATION;
            isPlaying = true;

            scoreDisplay.textContent = score;
            timeDisplay.textContent = `${timeLeft}초`;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // 타이머 루프
            timerInterval = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = `${timeLeft}초`;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // 두더지 출몰 루프
            gameInterval = setInterval(popUp, 700);
            popUp();
        }

        // 게임 종료 및 gameOver(점수) 함수 호출
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(timerInterval);

            // 남아있는 두더지 모두 내리기
            document.querySelectorAll('.mole-character').forEach(elem => elem.classList.remove('up'));

            // 지정된 gameOver 규격 함수 호출
            gameOver(score);
        }

        // 규격 필수 함수: gameOver(점수)
        function gameOver(finalScore) {
            finalScoreDisplay.textContent = `${finalScore}점`;
            gameOverModal.classList.remove('hidden');
        }

        // 모달 닫기 및 게임 재준비
        function closeModalAndReset() {
            gameOverModal.classList.add('hidden');
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            timeDisplay.textContent = `${GAME_DURATION}초`;
            scoreDisplay.textContent = '0';
        }

        // 페이지 로드 시 초기화
        window.onload = () => {
            createBoard();
        };
    </script>
</body>
</html>
